name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail

          VERSION_NAME="$(sed -n 's/^const val NEWPIPE_VERSION_NAME = "\(.*\)"$/\1/p' \
            buildSrc/src/main/kotlin/ProjectConfig.kt)"
          VERSION_CODE="$(sed -n 's/^const val NEWPIPE_VERSION_CODE = \([0-9][0-9]*\)$/\1/p' \
            buildSrc/src/main/kotlin/ProjectConfig.kt)"

          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Could not read version from ProjectConfig.kt" >&2
            exit 1
          fi
          if [[ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION_NAME" >&2
            exit 1
          fi

          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "RELEASE_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Sign and checksum APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -1)"
          mkdir -p out

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "out/NewPipe-${VERSION_NAME}.apk" \
            "$RUNNER_TEMP/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose "out/NewPipe-${VERSION_NAME}.apk"
          (cd out && sha256sum "NewPipe-${VERSION_NAME}.apk" > "NewPipe-${VERSION_NAME}.apk.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "out/NewPipe-${VERSION_NAME}.apk" \
              "out/NewPipe-${VERSION_NAME}.apk.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "out/NewPipe-${VERSION_NAME}.apk" \
              "out/NewPipe-${VERSION_NAME}.apk.sha256" \
              --title "NewPipe ${VERSION_NAME}" \
              --generate-notes
          fi
